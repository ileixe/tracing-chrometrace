[package]
name = "tracing-chrometrace"
version = "0.2.1"
edition = "2021"

authors = ["Youseok Yang <ileixe@gmail.com>"]
categories = ["asynchronous", "development-tools::debugging", "development-tools::profiling"]
description = "A Layer for tracing-subscriber that outputs Chrome-style traces."
documentation = "https://docs.rs/tracing-chrometrace"
keywords = ["profiling", "tracing", "flamegraph", "subscriber"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ileixe/tracing-chrometrace"

[dependencies]
itoa = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.26", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "std"] }

[dev-dependencies]
# The benchmark compares this layer against `tracing-chrome` and against a hand-rolled queue.
criterion = "0.5"
crossbeam-queue = "0.3"
rusty-fork = "0.3"
temp-file = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing-appender = "0.2"
tracing-chrome = "0.7"

[[bench]]
name = "benchmark"
harness = false
